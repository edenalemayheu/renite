name: Web CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'

jobs:
  # ── renite-app (user-facing React/Vite app) ──────────────────────────────────
  renite-app-ci:
    name: Renite App CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./renite-app

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./renite-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── renite-admin (admin React/Vite app) ──────────────────────────────────────
  renite-admin-ci:
    name: Renite Admin CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./renite-admin

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./renite-admin/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── blockchain (Hardhat 3 — DeviceRegistry) ──────────────────────────────────
  blockchain-ci:
    name: Blockchain CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blockchain

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./blockchain/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Run Tests
        run: npx hardhat test
